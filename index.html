<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ceniza libros - Promociones</title>
        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-stone-50 text-stone-800 antialised font-sans">
        <header class="bg-[#1b3b2b] text-stone-100 sticky top-0 z-50 shadow-md">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">

                <!logo + nombre>
                <a href="#" class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <span></span>
                    <span> Ceniza Libros </span>
                </a>
                
                <!menú de navegación>
                <nav class="hidden md:flex gap-6 text-sm font-medium">
                    <a href="#promos" class="hover:text-amber-200 transition-colors">Promociones</a>
                    <a href="#tienda" class="hover:text-amber-200 transition-colors">Comprar</a>
                    <a href="#nosotros" class="hover:text-amber-200 transition-colors">Quienes somos</a>
                    <a href="#contacto" class="hover:text-amber-200 transition-colors">Escribinos</a>
                </nav>
            </div>
        </header>

        <!--- Sección Hero (Principal)-->
        <section class="bg-[#1b3b2b] texto-stone-100 pt-10 pb-16 px-4 border-b border-amber-900/30">
            <div class="max-w-3xl mx-auto text-center space-y-4">
                <!--Tag o badge informativo-->
                <span class="inline-block bg-amber-100/10 text-amber-200 border border-amber-400/20 text-xs foiinto-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                    Vidriera digital, promos del mes
                </span>

                <!--Título principal único (h1)-->
                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white leading-tight">
                    Ahorrá en tus lecturas con nuestros medios de pago
                </h1>

                <!--Bajada, subtitulo explicativo-->

                <p class="text-stone-300 text-base md:text-lg max-w-xl mx-auto font-light">
                    Descuentos especiales, cuotas sin interés y promociones bancarias vigentes en el local. Encargá por Whastapp
                </p>

                <!--Botones de acción (CTA -> call to action)-->
                <div class="pt-4 flex flex-col sm:flex-row justify-center items-center gap-3">
                    <a href="#promos" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-6 py-3 rounded-lg shadow-md transition-all text-center">
                        Ver promociones vigentes
                    </a>
                    <a href="#tienda" class="w-full sm:auto bg-white/10 hover:bg-white/20 text-white font-medium px-6 py-3 rounded-lg border border-white/20 transition-all text-center">
                        Ir a la tienda
                    </a>
                </div>

            </div>

        </section>

    </body>
</html>
